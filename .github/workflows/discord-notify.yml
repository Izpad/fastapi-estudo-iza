name: Notificacao Discord

on:
  push:
    branches: [main]

jobs:
  notify:
    name: Envia alerta no Discord
    runs-on: ubuntu-latest

    steps:
      - name: Envia mensagem no Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AUTOR: ${{ github.event.head_commit.author.name }}
          MENSAGEM: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD=$(jq -n \
            --arg autor "$AUTOR" \
            --arg msg "$MENSAGEM" \
            --arg url "$COMMIT_URL" \
            --arg repo "$REPO" \
            '{content: ("Novo commit em **" + $repo + "** (branch main)\nAutor: " + $autor + "\nMensagem: " + $msg + "\n" + $url)}')
          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
