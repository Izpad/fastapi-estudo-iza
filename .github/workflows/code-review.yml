name: Code Review - Revisao automatica

on:
  pull_request:
    branches: [main]

jobs:
  review:
    name: Revisao automatica com ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configura Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala o ruff
        run: pip install ruff==0.6.9

      - name: Instala o reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Roda o ruff e comenta na PR
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff check --output-format=rdjson . | \
            reviewdog -f=rdjson -reporter=github-pr-review -fail-on-error=false -level=warning
